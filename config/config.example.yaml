# FreeCash (FCH) Solo Node Configuration

rpc:
  host: "127.0.0.1"
  port: 8332
  user: "fchrpc"
  password: "CHANGE_ME_SECURE_PASSWORD"
  timeout: 30

pool:
  # FreeCash-Adresse (beginnt mit F), z.B. von: freecash-cli getnewaddress
  payout_address: "Fxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

  stratum_port: 3333
  stratum_host: "0.0.0.0"
  start_difficulty: 256
  job_interval: 25
  payout_threshold: 10.0

monitor:
  host: "0.0.0.0"
  port: 5000

logging:
  level: "INFO"
