# FreeCash node configuration for solo mining

# RPC
rpcuser=freecashrpc
rpcpassword=CHANGE_ME_TO_A_STRONG_PASSWORD
rpcallowip=127.0.0.1
rpcallowip=172.16.0.0/12
rpcallowip=192.168.0.0/16
rpcbind=0.0.0.0
rpcport=8332

# Network
listen=1
server=1
maxconnections=64

# Performance / indexing
txindex=1

# Mining related (node itself does not mine – ASICs do via stratum)
gen=0

# Logging
logtimestamps=1
printtoconsole=1

# Optional: reduce disk usage if needed
# prune=550
