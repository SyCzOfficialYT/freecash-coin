# ============================================================
# In Portainer: Build method = WEB EDITOR (nicht Repository)
# Kompletten Inhalt kopieren → Deploy
# ============================================================

services:
  freecash-solo:
    build:
      context: https://github.com/SyCzOfficialYT/freecash-coin.git#main
      dockerfile: docker/Dockerfile.allinone
    container_name: freecash-solo
    network_mode: host
    volumes:
      - freecash-chain:/opt/newcoin
      - freecash-app:/app/data
      - freecash-config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
      - FCH_RPCUSER=fchrpc
      - FCH_RPCPASS=FreecashSoloAutoRpc_ChangeMeIfPublic
      - FCH_RPCPORT=8332
      - FCH_P2PPORT=8333
    restart: unless-stopped

volumes:
  freecash-chain:
  freecash-app:
  freecash-config:
