# Lokal / Portainer – All-in-One (Node + Stratum + Dashboard)
# Für reines Paste in Portainer: siehe portainer-stack.yml

services:
  freecash-solo:
    build:
      context: .
      dockerfile: docker/Dockerfile.allinone
    container_name: freecash-solo
    network_mode: host
    volumes:
      - freecash-chain:/opt/newcoin
      - freecash-app:/app/data
      - freecash-config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
      - FCH_RPCUSER=fchrpc
      - FCH_RPCPASS=FreecashSoloAutoRpc_ChangeMeIfPublic
      - FCH_RPCPORT=8332
      - FCH_P2PPORT=8333
    restart: unless-stopped

volumes:
  freecash-chain:
  freecash-app:
  freecash-config:
