version: "3.8"

# Ein Container: Stratum + Dashboard + Auto-Adresse
# Voraussetzung: freecashd auf dem Host mit RPC 127.0.0.1:8332
# network_mode: host → ASIC erreicht :3333, Container erreicht Node-RPC

services:
  freecash-solo:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: freecash-solo
    network_mode: host
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
