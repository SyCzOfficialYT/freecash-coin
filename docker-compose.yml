version: "3.8"

# Stratum + Dashboard. Node (bitcoincashIId) läuft typischerweise auf dem Host.
# network_mode: host → RPC 127.0.0.1 und Stratum :3333 erreichbar für ASIC.

services:
  stratum:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: solo-stratum
    network_mode: host
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./stratum:/app/stratum
    command: ["python3", "stratum/server.py"]
    restart: unless-stopped

  monitor:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: solo-monitor
    network_mode: host
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./monitor:/app/monitor
    command: ["python3", "monitor/app.py"]
    depends_on:
      - stratum
    restart: unless-stopped
